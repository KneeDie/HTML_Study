<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>利用类选择器画盒子</title>
</head>
<style>
    .red {
        width: 100px;
        height: 100px;
        /* 背景颜色 */
        background-color: red;
    }
    .green {
        width: 100px;
        height: 100px;
        background-color: green;
    }
</style>
<body>
    红色盒子
    <div class="red"></div>
    绿色盒子
    <div class="green"></div>
    红色盒子
    <div class="red"></div>
</body>
</html>
